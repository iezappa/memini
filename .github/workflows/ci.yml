name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "stable": a CI that silently changes toolchain under you is a
  # CI that fails for reasons unrelated to the commit under test.
  FLUTTER_VERSION: 3.47.1

defaults:
  run:
    working-directory: apps/client

jobs:
  check:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: dart analyze lib test

      - name: Test
        run: flutter test

  integration:
    name: Integration test (Linux desktop)
    runs-on: ubuntu-latest
    # These drive the real app, which is slower and worth nothing if the unit
    # tests are already red.
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The Linux desktop shell is a real GTK application, so it needs GTK and
      # a display even when nobody is watching. libsecret is where
      # flutter_secure_storage keeps the PIN on this platform, and its plugin
      # fails at CMake time without the headers — before a line of Dart runs.
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb
        working-directory: .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run the flows end to end
        run: xvfb-run -a flutter test integration_test -d linux

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    # dart2js catches things the analyser does not, but there is no point
    # compiling a tree whose tests are already red.
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build
        run: flutter build web --release

      # Compiling proves nothing about the database: Drift needs these two at
      # the site root, and without them the app loads, paints, and then cannot
      # open its store. `flutter build web` succeeds either way.
      - name: Check the Drift web assets shipped
        run: |
          for f in sqlite3.wasm drift_worker.js; do
            test -s "build/web/$f" || { echo "::error::build/web/$f is missing"; exit 1; }
          done
