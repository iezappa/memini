name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "stable": a CI that silently changes toolchain under you is a
  # CI that fails for reasons unrelated to the commit under test.
  FLUTTER_VERSION: 3.47.1

defaults:
  run:
    working-directory: apps/client

jobs:
  check:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: dart analyze lib test

      - name: Test
        run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    # dart2js catches things the analyser does not, but there is no point
    # compiling a tree whose tests are already red.
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build
        run: flutter build web --release
