name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-finished deploy
# would leave the published site in whatever state the upload reached.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Pages serves this repository under /memini/, not at a domain root.
      # Without the base href every asset would be requested one level up and
      # the page would load to a blank screen.
      - name: Build
        run: flutter build web --release --base-href /memini/

      # Drift loads these two from the site root at runtime. `flutter build
      # web` succeeds without them and the app then cannot open its database,
      # so a deploy that ships without them is a deploy of a broken app.
      - name: Check the Drift web assets shipped
        run: |
          for f in sqlite3.wasm drift_worker.js; do
            test -s "build/web/$f" || { echo "::error::build/web/$f is missing"; exit 1; }
          done

      # Own service worker (web/sw.js, registered by web/flutter_bootstrap.js):
      # inject the version and the precache manifest. Last step that touches
      # build/web, so every shipped file is in the manifest. Its scope is the
      # folder of sw.js, /memini/ here.
      - name: Generate the service worker
        run: sh tool/generate_sw.sh build/web pubspec.yaml

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/client/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
