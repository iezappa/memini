# Server block for nginxinc/nginx-unprivileged (replaces conf.d/default.conf).
#
# Notes on headers
# ----------------
# nginx drops ALL inherited add_header directives in a location that defines
# its own add_header. That is why the security/isolation headers are repeated
# in every location below.
#
# Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy:
#   Drift web docs: COOP "same-origin" + COEP "require-corp" (or
#   "credentialless") enable the fastest OPFS-based implementation
#   (synchronous file access via SharedArrayBuffer / Atomics.wait). Without
#   them Drift still works but falls back to IndexedDB-based storage.
#   https://drift.simonbinder.eu/platforms/web/
#   "require-corp" is used because Safari does not support "credentialless".
#   Consequence: every cross-origin resource must send CORP/CORS headers.
#   The Dockerfile builds with --no-web-resources-cdn so CanvasKit is served
#   from this origin. If the app loads other third-party resources (e.g.
#   fallback fonts from fonts.gstatic.com, images from other hosts), test them
#   in the browser console; remove COEP if something breaks and accept the
#   IndexedDB fallback.
#
#   Memini: its fonts are bundled and it shows no remote images (photos and
#   cover art were removed). The only cross-origin requests are the lookups
#   (api.themoviedb.org, api.rawg.io, musicbrainz.org), made with fetch/XHR in
#   CORS mode. COEP require-corp only blocks no-cors subresources lacking
#   CORP; a CORS request is allowed whenever the API answers with
#   Access-Control-Allow-Origin, which is what already lets these lookups run
#   in any browser. Nothing here needs COEP relaxed.
#
# Content-Security-Policy:
#   Written for a Flutter web build served from its own origin, so every
#   directive starts at 'self' and only what Flutter or the app actually
#   needs is added back.
#     script-src 'wasm-unsafe-eval' — the CanvasKit/skwasm renderer and the
#       Drift sqlite3.wasm module compile and instantiate WebAssembly. It
#       permits WebAssembly only; it does NOT re-enable eval() or
#       new Function(), which 'unsafe-eval' would.
#     style-src 'unsafe-inline' — the Flutter engine injects its stylesheet
#       (and per-view style rules) into the document at runtime. There is no
#       nonce to hand it, so this cannot be tightened without patching the
#       engine. Everything else stays locked down, so the residual risk is
#       CSS injection, not script execution.
#     connect-src — the lookup APIs the app calls with fetch/XHR:
#       api.themoviedb.org (TmdbSource), api.rawg.io (RawgSource),
#       musicbrainz.org (MusicBrainzSource). 'self' covers version.json,
#       update.json and the service worker. The web build checks for updates
#       against its OWN origin (WebUpdateService), so api.github.com is NOT
#       needed here — that path only runs on the native builds, where no CSP
#       applies.
#     font-src / connect-src fonts.gstatic.com — the engine downloads a Noto
#       fallback face when a glyph is missing from the bundled fonts, which
#       any entry typed in CJK, Hebrew or emoji will hit. The bundled fonts
#       are same-origin; this is only the fallback. CanvasKit is NOT on this
#       list: deploy/Dockerfile builds with --no-web-resources-cdn, so the
#       renderer is served from /canvaskit/ here.
#     img-src data: blob: — icons and the canvas/image decoding Flutter does.
#       No remote images: cover art and photos were removed.
#     worker-src 'self' blob: — drift_worker.js is same-origin, but the
#       engine and the wasm toolchain create workers from blob URLs.
#     object-src 'none', base-uri 'self', form-action 'none' — nothing in
#       this app embeds plugins, rewrites its base href, or submits a form.
#     frame-ancestors 'none' — clickjacking: nobody frames this app.
#
#   UNVERIFIED: this policy was reasoned from what the build contains, not
#   observed in a browser. Neither nginx nor a Docker daemon is reachable on
#   the machine that wrote it, so the config was never loaded and the app was
#   never served under it. Before trusting it, open the site, watch the
#   console for "Refused to ..." and walk one lookup per source (TODO.md).
#
# X-Frame-Options DENY:
#   The same thing as frame-ancestors for browsers that predate CSP level 2.
#   Redundant in anything current, cheap to keep.
#
# Referrer-Policy no-referrer:
#   The app has no remote images and its only outbound requests are the
#   lookups and the links the user opens on purpose. Sending a Referer would
#   leak the route the user was on and nothing here needs one.
#
# Caching:
#   Flutter web does NOT content-hash its main files (main.dart.js,
#   flutter_bootstrap.js, canvaskit/*). Long immutable caching would pin users
#   to old code, so code files use "no-cache" (always revalidated via ETag,
#   a cheap 304 when unchanged). Only static assets get a medium cache.
#   Offline use is handled by web/sw.js: it precaches with cache: "reload", so
#   the stored responses keep these headers (COOP/COEP/CORP) when served offline.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json application/wasm
        image/svg+xml font/ttf font/otf;

    # Liveness endpoint for the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache the entry points: they decide which version the user runs.
    # sw.js (own service worker) must always be revalidated, or users stay on an
    # old worker; its scope is "/" (same folder), so no Service-Worker-Allowed.
    # update.json is fetched network-only by the app and the worker.
    location ~ ^/(index\.html|sw\.js|flutter_service_worker\.js|flutter_bootstrap\.js|flutter\.js|manifest\.json|version\.json|update\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://api.themoviedb.org https://api.rawg.io https://musicbrainz.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # WebAssembly (sqlite3.wasm, CanvasKit, skwasm). Browsers require
    # application/wasm for streaming compilation.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://api.themoviedb.org https://api.rawg.io https://musicbrainz.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # JavaScript modules (.mjs is not in nginx's default mime.types) and
    # regular JS (main.dart.js, drift_worker.js, canvaskit loaders).
    location ~* \.(mjs|js)$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://api.themoviedb.org https://api.rawg.io https://musicbrainz.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Static assets (images, fonts, icons). Not hashed either, so a moderate
    # cache instead of "immutable".
    location ~* ^/(assets|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://api.themoviedb.org https://api.rawg.io https://musicbrainz.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (go_router path URLs) load index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://api.themoviedb.org https://api.rawg.io https://musicbrainz.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
